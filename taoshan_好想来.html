    tooltip:{trigger:'axis',valueFormatter:function(v){return fmt(v,m)+(m.unit?' '+m.unit:'');}},
    grid:{left:8,right:12,top:18,bottom:10,containLabel:true},
    xAxis:{type:'category',data:D.dates,boundaryGap:false,...ax,axisLabel:{...ax.axisLabel,formatter:function(x){return x.slice(5);},interval:6}},
    yAxis:{type:'value',...ax},
    dataZoom:[{type:'inside'}],
    series:[{name:m.label,type:'line',smooth:true,symbol:'none',connectNulls:false,data:PAGE.data.daily[m.key],lineStyle:{width:2.2},areaStyle:{opacity:.05}}]
  });
}
function monthLabel(x){const p=x.split('-');return Number(p[1])+'月';}
function makeMonthly(m){
  const wrap=document.createElement('div');wrap.className='panel';
  wrap.innerHTML='<div class="pt"></div><div class="pd"></div><div class="chart"></div>';
  wrap.querySelector('.pt').textContent='月度'+m.label;
  wrap.querySelector('.pd').textContent=m.agg==='avg'?'有数据日期平均值':'月度累计';
  document.getElementById('monthlyGrid').appendChild(wrap);
  const c=echarts.init(wrap.querySelector('.chart'));charts.push(c);
  c.setOption({
    color:[COLORS[m.key]],
    tooltip:{trigger:'axis',valueFormatter:function(v){return fmt(v,m)+(m.unit?' '+m.unit:'');}},
    grid:{left:8,right:12,top:18,bottom:10,containLabel:true},
    xAxis:{type:'category',data:D.months.map(monthLabel),...ax},
    yAxis:{type:'value',...ax},
    series:[{name:m.label,type:'bar',barMaxWidth:42,data:PAGE.data.monthly[m.key],itemStyle:{borderRadius:[5,5,0,0]},label:{show:true,position:'top',fontSize:10,color:'#374151',formatter:function(p){return fmt(p.value,m);}}}]
  });
}
function renderTable(){
  let html='<thead><tr><th>指标</th>'+D.months.map(monthLabel).map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>';
  D.metrics.forEach(function(m){
    html+='<tr><td>'+m.label+(m.unit?' ('+m.unit+')':'')+'</td>'+PAGE.data.monthly[m.key].map(function(v){return '<td>'+fmt(v,m)+'</td>';}).join('')+'</tr>';
  });
  document.getElementById('monthlyTable').innerHTML=html+'</tbody>';
}
renderKpis();
D.metrics.forEach(makeDaily);
D.metrics.forEach(makeMonthly);
renderTable();
window.addEventListener('resize',function(){charts.forEach(function(c){c.resize();});});
</script>
</body>
</html>
