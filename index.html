<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#111827;--ink2:#374151;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f4f6;--accent:#2563eb;--sidebar:#0f172a;--sidebar-hover:#1e293b;--sidebar-active:#2563eb}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;overflow:hidden}
.layout{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:230px;background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s ease}
.sidebar .brand{padding:22px 20px 18px;border-bottom:1px solid #1e293b}
.sidebar .brand .logo{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
.sidebar .brand .logo .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6)}
.sidebar .brand .sub{font-size:11px;color:#64748b;margin-top:6px;padding-left:18px}
.nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav .group-label{font-size:10px;color:#475569;text-transform:uppercase;letter-spacing:1px;padding:14px 12px 8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:8px;cursor:pointer;color:#94a3b8;font-size:13px;font-weight:500;margin-bottom:3px;transition:all .15s;user-select:none}
.nav-item:hover{background:var(--sidebar-hover);color:#e2e8f0}
.nav-item.active{background:var(--sidebar-active);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item .badge{margin-left:auto;font-size:10px;background:#1e293b;color:#94a3b8;padding:1px 7px;border-radius:10px}
.nav-item.active .badge{background:rgba(255,255,255,.2);color:#fff}
.menu{margin-bottom:8px}
.menu-parent{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:8px;color:#f8fafc;font-size:14px;font-weight:700;cursor:pointer;list-style:none;user-select:none;transition:background .15s}
.menu-parent:hover{background:var(--sidebar-hover)}
.menu-parent::-webkit-details-marker{display:none}
.menu-parent svg.menu-icon{width:18px;height:18px;color:#fbbf24}
.menu-parent .chevron{margin-left:auto;width:15px;height:15px;color:#94a3b8;transition:transform .2s}
.menu[open] .menu-parent .chevron{transform:rotate(90deg)}
.menu-body{margin:4px 0 8px 11px;padding-left:10px;border-left:1px solid #1e293b}
.menu-body .group-label:first-child{padding-top:6px}
.menu-body .nav-item{padding:9px 10px;font-size:12.5px}
.sidebar .foot{padding:14px 18px;border-top:1px solid #1e293b;font-size:10px;color:#475569;line-height:1.6}
.sidebar .foot a{color:#64748b;text-decoration:none}
.sidebar .foot a:hover{color:#94a3b8}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0}
.topbar .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--ink2)}
.topbar .menu-btn:hover{background:#f3f4f6}
.topbar .title{font-size:15px;font-weight:700}
.topbar .spacer{flex:1}
.topbar .meta{font-size:11px;color:var(--muted)}
.topbar .ext{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--ink2);text-decoration:none;background:#fff;cursor:pointer;transition:all .15s}
.topbar .ext:hover{border-color:var(--ink);color:var(--ink)}
.frame-wrap{flex:1;position:relative;background:#fff}
.frame-wrap iframe{width:100%;height:100%;border:0;display:block}

/* Mobile */
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.scrim.show{display:block}
@media(max-width:860px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:50;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .topbar .menu-btn{display:flex}
  .topbar .meta{display:none}
}
</style>

<script>
(function(){
  var items=document.querySelectorAll('.nav-item');
  var frame=document.getElementById('frame');
  var titleEl=document.getElementById('pageTitle');
  var extLink=document.getElementById('openExt');
  var sidebar=document.getElementById('sidebar');
  var scrim=document.getElementById('scrim');
  var menuBtn=document.getElementById('menuBtn');
  var dataPeriod=document.getElementById('dataPeriod');
  var topMeta=document.getElementById('topMeta');

  function refreshDataPeriod(){
    var stamp=Date.now();
    Promise.all([
      fetch('dash_data.json?t=' + stamp, {cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return null;}),
      fetch('taoshan_data.json?t=' + stamp, {cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return null;})
    ]).then(function(rs){
      var mt=rs[0]&&rs[0].latestDate?('美团 '+rs[0].latestDate):'美团数据加载中';
      var ts=rs[1]&&rs[1].latestDate?('淘闪 '+rs[1].latestDate):'淘闪数据加载中';
      dataPeriod.textContent=mt+' · '+ts;
    }).catch(function(){dataPeriod.textContent='每日自动更新';});
  }

  function activate(view){
    var el=document.querySelector('.nav-item[data-view="'+view+'"]');
    if(!el){el=items[0];view=el.dataset.view;}
    items.forEach(function(i){i.classList.remove('active')});
    el.classList.add('active');
    var parentMenu=el.closest('.menu');
    if(parentMenu)parentMenu.open=true;
    frame.src=el.dataset.src;
    titleEl.textContent=el.dataset.title;
    extLink.href=el.dataset.src;
    if(view.indexOf('cross-')===0){
      topMeta.textContent='跨平台：ROI = 当日销售额 / 当日补贴金额';
    } else if(view.indexOf('taoshan-')===0){
      topMeta.textContent='淘闪：8项指标 · 源文件缺失日期留空';
    } else {
      topMeta.textContent='门店数 = 铺货店铺数 × (1 - SKU售罄率)';
    }
    if(history.replaceState){history.replaceState(null,'','#'+view);}
    sidebar.classList.remove('open');scrim.classList.remove('show');
  }

  items.forEach(function(el){
    el.addEventListener('click',function(){activate(el.dataset.view);});
  });
  menuBtn.addEventListener('click',function(){
    sidebar.classList.add('open');scrim.classList.add('show');
  });
  scrim.addEventListener('click',function(){
    sidebar.classList.remove('open');scrim.classList.remove('show');
  });

  var hash=(location.hash||'').replace('#','');
  if(hash) activate(hash);
  refreshDataPeriod();
})();
</script>
