const MODE="subsidy";
const SERIES=[
  {key:'meituan',name:'美团',color:'#2563eb'},
  {key:'taoshan',name:'淘闪',color:'#d97706'},
  {key:'total',name:'美团+淘闪合计',color:'#16a34a'}
];
const charts=[];
const ax={axisLine:{lineStyle:{color:'#d1d5db'}},axisLabel:{color:'#6b7280',fontSize:10},splitLine:{lineStyle:{color:'#f3f4f6'}}};
function fmt(v,digits=0){if(v===null||v===undefined||Number.isNaN(v))return '--';return Number(v).toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits});}
function monthDay(x){return x.slice(5);}
function kpiCards(){
  const row=document.getElementById('kpiRow');
  SERIES.forEach(function(s){
    const item=D[s.key];
    const card=document.createElement('div');card.className='kpi';
    if(MODE==='sales'){
      card.innerHTML='<div class="lbl"><span class="dot" style="background:'+s.color+'"></span>'+s.name+'</div><div class="v">'+fmt(item.totalSales,0)+'<span class="u">元</span></div><div class="roi">最新日：'+fmt(item.sales[item.sales.length-1],0)+' 元</div>';
    }else{
      card.innerHTML='<div class="lbl"><span class="dot" style="background:'+s.color+'"></span>'+s.name+'</div><div class="v">'+fmt(item.totalSubsidy,0)+'<span class="u">元</span></div><div class="roi">期间 ROI：<b>'+fmt(item.totalRoi,2)+'</b></div>';
    }
    row.appendChild(card);
  });
}
function makeChart(metric,unit,heightClass){
  const wrap=document.createElement('div');wrap.className='panel';
  wrap.innerHTML='<div class="pt"></div><div class="pd"></div><div class="chart '+heightClass+'"></div>';
  const isRoi=metric==='roi';
  wrap.querySelector('.pt').textContent=isRoi?'每日 ROI':'每日'+unit;
  wrap.querySelector('.pd').textContent=isRoi?'ROI = 当日销售额 / 当日补贴金额':'单位：元';
  document.getElementById('chartArea').appendChild(wrap);
  const chart=echarts.init(wrap.querySelector('.chart'));charts.push(chart);
  chart.setOption({
    color:SERIES.map(s=>s.color),
    tooltip:{trigger:'axis',valueFormatter:function(v){return fmt(v,isRoi?2:0)+(isRoi?'':' 元');}},
    legend:{top:0,icon:'roundRect',itemWidth:12,itemHeight:8,textStyle:{color:'#374151'}},
    grid:{left:10,right:18,top:42,bottom:18,containLabel:true},
    xAxis:{type:'category',data:D.dates.map(monthDay),boundaryGap:false,...ax},
    yAxis:{type:'value',...ax},
    dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:0}],
    series:SERIES.map(s=>({name:s.name,type:'line',smooth:true,symbol:'none',connectNulls:false,data:D[s.key][metric],lineStyle:{width:2.4},emphasis:{focus:'series'}}))
  });
}
function tableHead(){
  if(MODE==='sales')return '<tr><th>日期</th><th>美团销售额</th><th>淘闪销售额</th><th>合计销售额</th></tr>';
  return '<tr><th>日期</th><th>美团补贴</th><th>美团ROI</th><th>淘闪补贴</th><th>淘闪ROI</th><th>合计补贴</th><th>合计ROI</th></tr>';
}
function renderTable(){
  let html='<thead>'+tableHead()+'</thead><tbody>';
  D.dates.forEach(function(day,i){
    html+='<tr><td>'+day+'</td>';
    if(MODE==='sales'){
      html+='<td>'+fmt(D.meituan.sales[i],2)+'</td><td>'+fmt(D.taoshan.sales[i],2)+'</td><td>'+fmt(D.total.sales[i],2)+'</td>';
    }else{
      ['meituan','taoshan','total'].forEach(function(k){
        html+='<td>'+fmt(D[k].subsidy[i],2)+'</td><td>'+fmt(D[k].roi[i],2)+'</td>';
      });
    }
    html+='</tr>';
  });
  document.getElementById('dailyTable').innerHTML=html+'</tbody>';
}

  ? '本页仅在美团与淘闪共同有数据的日期进行对比和合计；当前共 '+D.dates.length+' 天。'
  : '本页仅在美团与淘闪共同有数据的日期进行对比和合计；当前共 '+D.dates.length+' 天。补贴为 0 的日期 ROI 留空。';

else{makeChart('subsidy','补贴金额','compact');makeChart('roi','ROI','compact');}
renderTable();
window.addEventListener('resize',function(){charts.forEach(c=>c.resize());});
