    {l:"8月销售额",v:fmt2(k.augMtd),u:"元",d:dtxt(sg),c:dcls(sg),s:"7月同期 ¥"+fmt2(k.julSamePeriod)},
    {l:"品牌投入(含税)",v:fmt2(k.augSub),u:"元",d:dtxt(ig),c:dcls(ig),s:"7月同期 ¥"+fmt2(k.julSameSub)},
    {l:"投入占比",v:k.augRatio,u:"%",d:"",c:"flat",s:"品牌投入/销售额"},
    {l:"全周期销售额",v:fmt2(t.销售额),u:"元",d:"",c:"flat",s:"销量"+fmt(t.销量)+"件 · 订单"+fmt(t.订单)},
  ].map(x=>'<div class="kpi"><div class="lbl"><span>'+x.l+'</span>'+(x.d?'<span class="delta '+x.c+'">'+x.d+'</span>':'')+'</div><div class="v" style="color:'+(x.l==='品牌投入(含税)'?C:'var(--ink)')+'">'+x.v+'<span class="u">'+x.u+'</span></div><div class="sub">'+x.s+'</div></div>').join("");
})();

function rbar(items,fn){
  const s=items.slice().sort(function(a,b){return a.value-b.value;});
  const mx=Math.max.apply(null,s.map(function(d){return d.value;}));
  const data=s.map(function(d,i){return{name:d.name.length>14?d.name.slice(0,13)+"…":d.name,fullName:d.name,value:d.value,itemStyle:{color:d.value===mx?"#16a34a":"rgba(17,24,39,"+(0.3+0.55*(i/Math.max(1,s.length-1))).toFixed(2)+")",borderRadius:[0,3,3,0]}};});
  return{grid:{left:8,right:65,top:8,bottom:8,containLabel:true},tooltip:{trigger:"axis",axisPointer:{type:"shadow"},formatter:function(p){return p[0].data.fullName+"<br/>"+fn(p[0].value);}},
    xAxis:{type:"value",axisLine:ax.axisLine,axisTick:ax.axisTick,splitLine:ax.splitLine,axisLabel:{color:"#6b7280",fontSize:10,formatter:function(v){return fmt(v);}}},
    yAxis:{type:"category",data:s.map(function(d){return d.name.length>14?d.name.slice(0,13)+"…":d.name;}),axisLine:ax.axisLine,axisTick:ax.axisTick,splitLine:{show:false},axisLabel:{color:"#374151",fontSize:10}},
    series:[{type:"bar",data:data,barMaxWidth:18,label:{show:true,position:"right",formatter:function(p){return fn(p.value);},fontSize:10,color:"#374151"}}]};
}
mk("c_ps").setOption(rbar(D.prodSales,function(v){return"¥"+fmt2(v);}));
mk("c_pv").setOption(rbar(D.prodVol,function(v){return fmt(v)+"件";}));
mk("c_pb").setOption(rbar(D.prodSub,function(v){return"¥"+fmt2(v);}));

(function(){
  const m=D.monthly;
  const ratio=m.销售额.map(function(s,i){return s>0?+(m.补贴[i]/s*100).toFixed(2):0;});
  mk("c_ms").setOption({tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontSize:10}},
    grid:{left:8,right:8,top:32,bottom:8,containLabel:true},
    xAxis:{type:"category",data:m.months,...ax},
    yAxis:[{type:"value",...ax,axisLabel:{...ax.axisLabel,formatter:function(v){return fmt(v);}}},{type:"value",...ax,splitLine:{show:false},axisLabel:{...ax.axisLabel,formatter:"{value}%"},max:function(v){return Math.ceil(v.max*1.3);}}],
    series:[{name:"销售额",type:"bar",data:m.销售额,itemStyle:{color:C,borderRadius:[4,4,0,0]},barMaxWidth:36},{name:"品牌补贴",type:"bar",data:m.补贴,itemStyle:{color:"#f59e0b",borderRadius:[4,4,0,0]},barMaxWidth:36},{name:"补贴率",type:"line",yAxisIndex:1,data:ratio,smooth:true,symbol:"circle",symbolSize:7,lineStyle:{width:2.5,color:"#dc2626"},itemStyle:{color:"#dc2626"},label:{show:true,formatter:"{c}%",fontSize:10,color:"#dc2626",position:"top"}}]});
  mk("c_mv").setOption({tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontSize:10}},
    grid:{left:8,right:8,top:32,bottom:8,containLabel:true},
    xAxis:{type:"category",data:m.months,...ax},
    yAxis:[{type:"value",name:"销量",...ax,axisLabel:{...ax.axisLabel,formatter:function(v){return fmt(v);}}},{type:"value",name:"订单",...ax,splitLine:{show:false},axisLabel:{...ax.axisLabel,formatter:function(v){return fmt(v);}}}],
    series:[{name:"销量",type:"bar",data:m.销量,itemStyle:{color:"rgba(37,99,235,0.5)",borderRadius:[4,4,0,0]},barMaxWidth:40},{name:"订单数",type:"line",yAxisIndex:1,data:m.订单,smooth:true,symbol:"circle",symbolSize:7,lineStyle:{width:2.5,color:"#0d9488"},itemStyle:{color:"#0d9488"}}]});
})();

(function(){
  const prods=D.prods;let sel=new Set(prods);let mode="all";
  const box=document.getElementById("prodChips");
  const allChip='<div class="chip all on" data-act="all">全选</div>';
  box.innerHTML=allChip+prods.map(function(p,i){return'<div class="chip on" data-i="'+i+'">'+(p.length>10?p.slice(0,9)+"…":p)+'</div>';}).join("");
  const tabs=document.getElementById("dayTabs");
  const c=mk("c_daily");
  function up(){
    const n=D.daily.dates.length;
    const v=new Array(n).fill(0),s=new Array(n).fill(0),b=new Array(n).fill(0);
    sel.forEach(function(p){const pd=D.prodDaily[p];for(let i=0;i<n;i++){v[i]+=pd.v[i];s[i]+=pd.s[i];b[i]+=pd.b[i];}});
    const st=new Array(n).fill(0);sel.forEach(function(p){const pd=D.prodDaily[p];for(let i=0;i<n;i++){if(pd.st[i]>st[i])st[i]=pd.st[i];}});
    let series;
    if(mode==="store"){
      series=[{name:"门店数",type:"line",smooth:true,symbol:"none",data:st,lineStyle:{width:2.2,color:"#7c3aed"},itemStyle:{color:"#7c3aed"},areaStyle:{opacity:0.08,color:"#7c3aed"}}];
    }else if(mode==="vol"){
      series=[{name:"销量",type:"bar",data:v.map(function(x){return Math.round(x*100)/100;}),itemStyle:{color:"rgba(37,99,235,0.4)"},barMaxWidth:8}];
    }else{
      series=[
        {name:"销售额",type:"line",smooth:true,symbol:"none",data:s.map(function(x){return Math.round(x*100)/100;}),lineStyle:{width:2.2,color:C},itemStyle:{color:C},areaStyle:{opacity:0.08,color:C}},
        {name:"品牌补贴",type:"line",smooth:true,symbol:"none",data:b.map(function(x){return Math.round(x*100)/100;}),lineStyle:{width:2,color:"#ea580c",type:"dashed"},itemStyle:{color:"#ea580c"}}
      ];
    }
    c.setOption({tooltip:{trigger:"axis",formatter:function(p){let s2=p[0].axisValue+"<br/>";p.forEach(function(x){const u=(x.seriesName==="销售额"||x.seriesName==="品牌补贴")?"¥":"";s2+='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+x.color+';margin-right:6px"></span>'+x.seriesName+"："+u+Number(x.value).toLocaleString("zh-CN",{maximumFractionDigits:2})+"<br/>";});return s2;}},
      legend:{top:0,textStyle:{fontSize:10}},grid:{left:8,right:8,top:30,bottom:8,containLabel:true},
      xAxis:{type:"category",data:D.daily.dates,boundaryGap:false,...ax,axisLabel:{...ax.axisLabel,formatter:function(x){return x.slice(5);},interval:6}},
      yAxis:{type:"value",...ax,axisLabel:{...ax.axisLabel,formatter:function(x){return fmt(x);}}},dataZoom:[{type:"inside"}],series:series},true);
  }
  box.querySelectorAll(".chip").forEach(function(el){
    el.onclick=function(){
      if(el.dataset.act==="all"){sel=new Set(prods);box.querySelectorAll(".chip").forEach(function(x){x.classList.add("on");});}
      else{const p=prods[+el.dataset.i];if(el.classList.contains("on")){if(sel.size<=1)return;sel.delete(p);el.classList.remove("on");}else{sel.add(p);el.classList.add("on");}box.querySelector('[data-act="all"]').classList.toggle("on",sel.size===prods.length);}
      up();
    };
  });
  tabs.querySelectorAll(".chip").forEach(function(t){
    t.onclick=function(){tabs.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");});t.classList.add("on");mode=t.dataset.m;up();};
  });
  up();
})();

window.addEventListener("resize",function(){charts.forEach(function(c){c.resize();});});
</script>
</body>
</html>
