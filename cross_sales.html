    dataZoom:dense?[{type:"inside",start:55,end:100},{type:"slider",height:16,bottom:14,start:55,end:100}]:[],
    series:SERIES.map((s,idx)=>({
      name:s.n,type:"bar",barGap:"15%",barWidth:dense?"62%":"30%",
      data:barData(rows,metric,s),
      label:{show:!dense,position:"top",fontSize:10,color:"#374151",formatter:function(p){
        const r=rows[p.dataIndex];if(r.status==="pending"||p.value==null)return"";
        return isRoi?p.value:w(p.value);
      }},
      markArea:idx===0?{data:markArea(rows)}:undefined
    }))
  };
}
function renderTable(rows){
  let h="<thead><tr><th>期间</th><th>状态</th><th>美团销额</th><th>淘闪销额</th><th>合计销额</th><th>美团补贴</th><th>淘闪补贴</th><th>合计补贴</th><th>合计ROI</th></tr></thead><tbody>";
  rows.slice().reverse().forEach(r=>{
    const st=r.status==="pending"?"未结算":r.status==="partial"?"跨结算期":"已结算";
    h+='<tr class="'+(r.status==="pending"?"pend":"")+'"><td>'+r.label+'</td><td>'+st+'</td>'
      +"<td>"+fmt(r.mtSales,0)+"</td><td>"+fmt(r.tsSales,0)+"</td><td>"+fmt(r.ttSales,0)+"</td>"
      +"<td>"+fmt(r.mtSub,0)+"</td><td>"+fmt(r.tsSub,0)+"</td><td>"+fmt(r.ttSub,0)+"</td><td>"+fmt(r.ttRoi,2)+"</td></tr>";
  });
  document.getElementById("detailTable").innerHTML=h+"</tbody>";
}
function render(g){
  const rows=D.periods[g];
  charts.sales.setOption(option(rows,"Sales",false),true);
  charts.sub.setOption(option(rows,"Sub",false),true);
  charts.roi.setOption(option(rows,"Roi",true),true);
  const hintMap={
    month:"按自然月汇总；当前月为 1 日至数据当日 MTD；淘闪 2026/8/10 起有数，6–7 月合计仅含美团。",
    week:"按周一至周日汇总；* 为跨补贴结算期的周，10 月账单未结算部分以灰柱和黄底标注。",
    day:"按自然日（共同覆盖日期）；默认显示最近区间，可拖动底部滑块。"
  };
  document.getElementById("pdSales").textContent=hintMap[g];
  document.getElementById("pdSub").textContent=hintMap[g]+" 灰柱为账单未结算期已匹配金额，非最终值。";
  document.getElementById("pdRoi").textContent=hintMap[g]+" ROI 按期合计重算，补贴为 0 或未结算时留空。";
  document.getElementById("tblHint").textContent=g==="month"?"最新月份在最上":"最新期间在最上";
  renderTable(rows);
}
function kpiCards(){
  const m=D.mtd,c=m.cur,p=m.prv;
  const arrow=v=>v==null?"":(v>=0?'<span class="up">▲ '+Math.abs(v)+'%</span>':'<span class="dn">▼ '+Math.abs(v)+'%</span>');
  const badge='<span class="badge">10月账单未结算</span>';
  const row=document.getElementById("kpiRow");
  row.innerHTML=
    '<div class="kpi"><div class="lbl">当月累计销额（'+m.asof.slice(5).replace("-","/")+"，"+m.days+' 天）</div>'
    +'<div class="v">'+w(c.sales)+'<span class="u">元</span></div>'
    +'<div class="cmp">较上月同期 '+w(p.sales)+' 元 '+arrow(m.pctSales)+'<br>美团 '+w(c.mtSales)+' ｜ 淘闪 '+w(c.tsSales)+'</div></div>'
    +'<div class="kpi">'+(m.subsidyPending?badge:"")+'<div class="lbl">当月品牌补贴费用</div>'
    +'<div class="v '+(m.subsidyPending?"pending":"")+'">'+(m.subsidyPending?"待结算":w(c.subsidy)+'<span class="u">元</span>')+'</div>'
    +'<div class="cmp">'+(m.subsidyPending?"目前仅匹配 "+w(c.subsidy)+" 元，非最终值":"较上月同期 "+arrow(m.pctSubsidy))+'<br>上月同期实际 '+w(p.subsidy)+' 元（美团 '+w(p.mtSub)+' / 淘闪 '+w(p.tsSub)+'）</div></div>'
    +'<div class="kpi">'+(m.subsidyPending?'<span class="badge">待补贴账单</span>':"")+'<div class="lbl">当月 ROI（倍）</div>'
    +'<div class="v '+(m.subsidyPending?"pending":"")+'">'+(m.subsidyPending?"—":fmt(c.roi,2))+'</div>'
    +'<div class="cmp">补贴账单回写后自动计算<br>上月同期合计 '+fmt(p.roi,2)+'（美团 '+fmt(p.mtRoi,2)+' / 淘闪 '+fmt(p.tsRoi,2)+'）</div></div>';
}
document.getElementById("rangeText").textContent=D.startDate+" 至 "+D.latestDate;
const warnPending=D.mtd.subsidyPending;
document.getElementById("noteText").className="note"+(warnPending?" warn":"");
document.getElementById("noteText").textContent=(warnPending
  ?"⚠ 当月品牌补贴账单尚未匹配回写（近 5 日以上补贴接近 0），当月补贴与 ROI 暂不可用，图表中以灰柱/缺口标注，15:00 账单任务完成后自动补齐；销额数据完整。 ":"" )
  +"本页按两平台共同覆盖日期对齐，当前共 "+D.dates.length+" 天；补贴结算截止 "+D.settleCutoff+"。";
charts.sales=echarts.init(document.getElementById("cSales"));
charts.sub=echarts.init(document.getElementById("cSub"));
charts.roi=echarts.init(document.getElementById("cRoi"));
kpiCards();render("month");
document.getElementById("seg").addEventListener("click",function(e){
  if(e.target.dataset.g){[].forEach.call(document.querySelectorAll("#seg button"),b=>b.classList.remove("on"));e.target.classList.add("on");render(e.target.dataset.g);}
});
window.addEventListener("resize",function(){Object.values(charts).forEach(c=>c.resize());});
</script>
</body>
</html>
